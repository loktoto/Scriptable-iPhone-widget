name: Validate Scriptable widgets
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax, commute schedule and countdown
        run: node tests/validate.js
      - name: Exercise Expense Tracker Shortcuts import without HTTP
        run: node tests/expense-import.test.js
      - name: Test editable Expense Dashboard transactions
        run: node tests/expense-dashboard-edit.test.js
      - name: Test swipe-to-delete and safe transaction removal
        run: node tests/expense-dashboard-delete.test.js
      - name: Test manual expense entry and visual form
        run: node tests/expense-manual-entry.test.js
      - name: Test real Scriptable app Dashboard and manual menu paths
        run: node tests/expense-app-routes.test.js
      - name: Test merchant types, payment types, remarks and Dashboard filters
        run: node tests/expense-merchant-payment-remark.test.js
      - name: Test compact Dashboard and dynamic payment types
        run: node tests/expense-dashboard-responsive.test.js
      - name: Test premium expense Dashboard and 食飯 category compatibility
        run: node tests/expense-dashboard-aesthetic.test.js
      - name: Verify 100-source Dashboard UX research map
        run: node tests/expense-dashboard-research.test.js
      - name: Test progressively enriched Expense Widgets (Small / Medium / Large / iPad XL)
        run: node tests/expense-widget-sizes.test.js
      - name: Audit Expense source cleanliness and script mirrors
        run: node tests/expense-source-cleanliness.test.js
      - name: Validate 100-source Widget readability research provenance
        run: node tests/expense-widget-research-v3-16.test.js
      - name: Enforce independent versions, changelogs and mirror parity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/check-widget-versions.js
